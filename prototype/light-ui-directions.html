<!doctype html>
<!-- THROWAWAY UI PROTOTYPE — five light-only directions for Eruditio. Not production. Use ?variant=A|B|C|D|E. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eruditio — five light directions</title>
<style>
:root{--paper:#faf7f0;--surface:#fffefb;--ink:#221f1a;--muted:#8a8272;--rule:#e4dfd2;--gold:#c8a24a;--wash:#f1ede3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#ddd8cc;color:var(--ink);font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 12px 108px}.note{width:390px;color:#686257;font:11px/1.4 monospace;letter-spacing:.06em;margin-bottom:12px;text-transform:uppercase}.phone{width:390px;height:800px;background:#171612;border-radius:38px;padding:12px 9px;box-shadow:0 28px 60px #3b352b66}.screen{height:100%;overflow:auto;background:var(--paper);border-radius:28px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.status{height:28px;padding:8px 18px 0;display:flex;justify-content:space-between;color:var(--muted);font:10px monospace}.eyebrow{font:10px monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.serif{font-family:Georgia,serif}.muted{color:var(--muted)}.gold{color:var(--gold)}.rule{border-color:var(--rule)}button{font:inherit;cursor:pointer}.primary{border:0;background:var(--ink);color:var(--paper);padding:13px 16px;font-weight:700}.link{border:0;background:transparent;color:var(--ink);padding:10px 0;text-decoration:underline;text-underline-offset:3px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;background:#171612;color:#f7f2e8;border-radius:999px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px #0005;font:12px monospace;max-width:96vw}.switcher button{border:0;background:none;color:#f7f2e8;font-size:18px;padding:3px 8px}.switcher .name{min-width:220px;text-align:center}.switcher .readout{color:#bcb5a6;font-size:10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A — editorial reading desk */.a{background:var(--paper);font-family:Arial,sans-serif}.a header{padding:20px 22px 16px;border-bottom:1px solid var(--rule)}.a h1{font:normal 31px/1.05 Georgia,serif;margin:9px 0 7px}.a header p{font-size:12px;color:var(--muted);margin:0}.a section{padding:16px 22px;border-bottom:1px solid var(--rule)}.a .continue{background:var(--surface);margin:0;padding:18px 22px}.a .book{font:25px Georgia,serif;margin:10px 0 5px}.a .byline{font-size:12px;color:var(--muted)}.a .track{height:5px;background:var(--rule);margin:18px 0 7px;position:relative}.a .track i{display:block;height:100%;width:41%;background:var(--ink)}.a .track b{position:absolute;right:0;top:-20px;font:10px monospace;color:var(--muted)}.a .actions{display:flex;gap:12px;align-items:center;margin-top:14px}.a .actions .primary{flex:1}.a .review{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}.a .review:last-child{border:0}.a .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px}.a nav{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding:12px 8px 16px;font:10px monospace;color:var(--muted)}.a nav b{color:var(--ink)}
/* B — session-first console */.b{background:var(--surface);font-family:Arial,sans-serif}.b .top{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}.b .hero{padding:28px 20px 20px}.b .hero h1{font:normal 35px/1.02 Georgia,serif;margin:12px 0}.b .hero h1 em{color:var(--gold);font-style:normal}.b .hero p{font-size:13px;line-height:1.5;color:var(--muted);max-width:270px}.b .session{margin:0 16px;border:1px solid var(--ink);background:var(--paper)}.b .session-head{padding:15px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center}.b .num{font:42px Georgia,serif;color:var(--gold)}.b .session-head strong{font:18px Georgia,serif}.b .session-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.b .setup{padding:14px 15px}.b .setup label{display:block;font:10px monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 7px}.b .choices{display:flex;gap:6px}.b .choices button{flex:1;border:1px solid var(--rule);background:transparent;padding:9px 0;font-size:12px}.b .choices .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.b .setup .primary{width:100%;margin-top:17px}.b .replace{display:block;width:100%;margin-top:5px}.b .aside{margin:21px 20px;padding-top:15px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-size:12px}.b .aside b{font-size:20px;font-family:Georgia,serif}
/* C — library/mastery workspace */.c{background:var(--wash);font-family:Arial,sans-serif}.c header{padding:19px 18px 13px}.c h1{font:normal 29px Georgia,serif;margin:8px 0 4px}.c .search{border:1px solid var(--rule);background:var(--surface);padding:10px 12px;color:var(--muted);font-size:12px;margin-top:15px}.c .filters{display:flex;gap:7px;padding:0 18px 14px;font:10px monospace}.c .filters span{padding:7px 8px;border:1px solid var(--rule);background:var(--surface)}.c .filters .on{background:var(--ink);color:var(--paper)}.c .list{margin:0 12px;background:var(--surface);border:1px solid var(--rule)}.c .item{display:grid;grid-template-columns:5px 1fr auto;gap:10px;align-items:center;padding:13px 12px;border-bottom:1px solid var(--rule)}.c .item:last-child{border:0}.c .spine{height:40px;background:var(--rule)}.c .spine i{display:block;width:100%;height:var(--p);background:var(--gold)}.c .item strong{font:16px Georgia,serif}.c .item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.c .dial{width:34px;height:34px;border:3px solid var(--gold);border-right-color:var(--rule);border-radius:50%;display:grid;place-items:center;font:9px monospace}.c .map{margin:14px 12px;padding:15px;background:var(--ink);color:var(--paper)}.c .map-head{display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.1em}.c .levels{display:flex;gap:6px;margin-top:14px}.c .level{flex:1;border-top:3px solid var(--gold);padding-top:7px;font-size:10px}.c .level b{display:block;font:23px Georgia,serif}.c nav{position:sticky;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--rule);padding:13px 5px 17px;font:10px monospace;color:var(--muted)}.c nav b{color:var(--ink)}
/* D — physical workbench, intentionally strange */.d{background:#eee9de;font-family:Arial,sans-serif;overflow:hidden}.d .workbench{height:100%;display:grid;grid-template-columns:82px 1fr 82px;grid-template-rows:38px 1fr 42px}.d .top{grid-column:1/-1;padding:12px 14px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.08em}.d .drawer,.d .tray{background:#e4ded1;padding:15px 8px;font-size:10px}.d .drawer{border-right:1px solid var(--ink)}.d .tray{border-left:1px solid var(--ink)}.d .drawer h3,.d .tray h3{font:10px monospace;letter-spacing:.08em;margin:0 0 14px}.d .loose{display:block;width:100%;background:var(--surface);border:1px solid var(--rule);padding:10px 5px;margin:8px 0;text-align:left;font:12px/1.2 Georgia,serif}.d .loose.on{border:2px solid var(--ink)}.d .desk{padding:22px 15px;display:flex;flex-direction:column;align-items:center}.d .desk-label{font:10px monospace;letter-spacing:.1em;color:var(--muted);align-self:stretch}.d .sheet{width:100%;margin-top:22px;background:var(--surface);border:1px solid var(--ink);box-shadow:7px 8px 0 #c8c0b0;padding:20px 15px;transform:rotate(-1deg)}.d .sheet .mark{font:36px Georgia,serif;color:var(--gold)}.d .sheet h1{font:26px/1 Georgia,serif;margin:12px 0 7px}.d .sheet p{font-size:12px;color:var(--muted);line-height:1.5}.d .sheet .primary{width:100%;margin-top:22px}.d .drop{width:100%;margin-top:22px;border:1px dashed var(--muted);padding:14px 6px;text-align:center;font:10px monospace;color:var(--muted)}.d .handle{grid-column:1/-1;border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:22px;font:10px monospace}.d .handle button{border:0;background:none;font-size:18px}.d .tray .count{font:32px Georgia,serif;color:var(--gold)}
/* E — one continuous timeline, intentionally no tabs */.e{background:var(--paper);font-family:Arial,sans-serif}.e header{padding:18px 20px 12px;display:flex;justify-content:space-between}.e h1{font:normal 33px/1 Georgia,serif;margin:17px 20px 5px}.e .dek{margin:0 20px 22px;color:var(--muted);font-size:12px;line-height:1.5}.e .thread{margin:0 20px;border-left:2px solid var(--ink);padding-left:19px}.e .event{position:relative;padding:0 0 24px 5px}.e .event:before{content:"";position:absolute;left:-26px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}.e .event.now:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px #c8a24a22}.e .date{font:10px monospace;letter-spacing:.1em;color:var(--muted)}.e .event h2{font:21px Georgia,serif;margin:7px 0}.e .event p{font-size:12px;color:var(--muted);line-height:1.45;margin:0}.e .event .primary{margin-top:12px}.e .branch{margin:2px 0 24px -40px;padding:13px 12px;background:var(--wash);border:1px solid var(--rule);font-size:12px}.e .branch b{font-family:Georgia,serif;font-size:16px}.e .end{border-top:1px solid var(--rule);padding:16px 0 24px;display:flex;justify-content:space-between;align-items:end}.e .end strong{font:28px Georgia,serif}.e .end button{border:0;background:transparent;text-decoration:underline;color:var(--ink);font-size:12px}
</style></head>
<body>
<div class="note">Throwaway prototype · Paper light palette only · A–C credible alternatives · D–E extreme reinventions</div>
<div class="phone"><main class="screen" id="stage" aria-live="polite"></main></div>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span class="name" id="name"></span><button id="next" aria-label="Next variant">→</button><span class="readout" id="readout"></span></nav>
<script>
const titles={A:'Editorial reading desk',B:'Session-first console',C:'Library + mastery',D:'Physical workbench',E:'Continuous timeline'};
const books=[['Meditations','Marcus Aurelius · Book II','41%','62%'],['Republic','Plato · Jowett','12%','38%'],['Confessions','Augustine · Pusey','22%','18%'],['The Odyssey','Homer · Butler','—','4%']];
const rows=books.map((b,i)=>`<div class="item"><i class="spine" style="--p:${b[3]}"><i></i></i><div><strong>${b[0]}</strong><small>${b[1]}</small></div><span class="dial">${b[2]}</span></div>`).join('');
const views={
A:()=>`<div class="a"><div class="status"><span>9:41</span><span>PRIVATE / ON-DEVICE</span></div><header><div class="eyebrow">Eruditio / reading desk</div><h1>Return to the page.</h1><p>One considered session is enough for today.</p></header><section class="continue"><div class="eyebrow">Continue · checkpoint 12 of 31</div><div class="book">Meditations</div><div class="byline">Marcus Aurelius · Book II</div><div class="track"><i></i><b>41%</b></div><div class="actions"><button class="primary" data-state="Continuing Meditations at checkpoint 12">Continue session →</button><button class="link" data-state="Replace is a quiet alternative">Replace</button></div></section><section><div class="eyebrow">Review queue</div><div class="review"><span><i class="dot"></i>Republic · segment 3</span><span class="muted">familiar</span></div><div class="review"><span><i class="dot"></i>Meditations · segment 1</span><span class="muted">proficient</span></div><div class="review"><span><i class="dot"></i>3 more return points</span><span class="muted">today</span></div></section><section><div class="eyebrow">From the shelf</div><div class="review"><span>Republic</span><span class="muted">12% read</span></div><div class="review"><span>Confessions</span><span class="muted">22% read</span></div></section><nav><b>⌂ Today</b><span>▤ Library</span><span>↺ Review</span><span>◉ Progress</span><span>⚙ Settings</span></nav></div>`,
B:()=>`<div class="b"><div class="status"><span>9:41</span><span>SESSION 01 / UNSAVED</span></div><div class="top"><span class="eyebrow">Next session</span><span class="gold">12 MIN</span></div><div class="hero"><div class="eyebrow">A bounded return</div><h1>What will you<br><em>make room for?</em></h1><p>Choose a stopping point before you begin. Your place is remembered on this device.</p></div><div class="session"><div class="session-head"><div class="num">01</div><div><strong>Meditations</strong><small>Marcus Aurelius · Book II</small></div></div><div class="setup"><label>Session length</label><div class="choices"><button>08 min</button><button class="on">12 min</button><button>20 min</button></div><label>Stop at</label><div class="choices"><button>Next page</button><button class="on">Checkpoint 12</button></div><button class="primary" data-state="Session armed: 12 minutes, stop at checkpoint 12">Start reading →</button><button class="link replace" data-state="Replace stays secondary and reversible">Replace this text</button></div></div><div class="aside"><span>Reviews waiting<br><b>3</b></span><span>Next return<br><b>Tomorrow</b></span><span>Current streak<br><b>4 days</b></span></div></div>`,
C:()=>`<div class="c"><div class="status"><span>9:41</span><span>30 TEXTS / OFFLINE</span></div><header><div class="eyebrow">Library / ownership</div><h1>Your working shelf</h1><div class="muted" style="font-size:12px">Progress, review state, and the next honest action.</div><div class="search">⌕ &nbsp; Search titles, authors, groups</div></header><div class="filters"><span class="on">All 30</span><span>In progress 4</span><span>Due 3</span><span>Unread 23</span></div><div class="list">${rows}</div><section class="map"><div class="map-head"><span>MASTERY MAP</span><span>THIS WEEK</span></div><div class="levels"><div class="level"><b>18</b>familiar</div><div class="level"><b>7</b>proficient</div><div class="level"><b>3</b>mastered</div></div></section><nav><b>▤ Library</b><span>▸ Continue</span><span>↺ Review</span><span>◉ Progress</span><span>⚙ Settings</span></nav></div>`,
D:()=>`<div class="d"><div class="workbench"><div class="top"><span>ERUDITIO / WORKBENCH</span><span>NO TABS · NO FEEDS</span></div><aside class="drawer"><h3>AVAILABLE TEXT</h3><button class="loose on">Meditations<br><small>41%</small></button><button class="loose">Republic<br><small>12%</small></button><button class="loose">Confessions<br><small>22%</small></button><button class="loose">Odyssey<br><small>—</small></button></aside><main class="desk"><div class="desk-label">ACTIVE SURFACE / ONE INTENTION</div><article class="sheet"><div class="mark">✦</div><h1>Meditations</h1><p>Place the next bounded session here. The page is not a feed; it is a surface you return to.</p><div class="eyebrow" style="margin-top:18px">CHECKPOINT 12 / BOOK II</div><button class="primary" data-state="Placed on workbench: continue Meditations">Continue from checkpoint →</button><div class="drop">Drop another text here<br>to compare or replace</div></article></main><aside class="tray"><h3>REVIEW TRAY</h3><div class="count">03</div><p class="muted">return points<br>due today</p><div class="rule" style="height:1px;margin:17px 0"></div><p class="eyebrow">DUE NEXT</p><p style="line-height:1.5">Republic<br><span class="muted">segment 3</span></p></aside><div class="handle"><button>‹</button><span>SWIPE EDGES FOR TEXT / REVIEW</span><button>›</button></div></div></div>`,
E:()=>`<div class="e"><div class="status"><span>9:41</span><span>ONE THREAD / NO TABS</span></div><header><span class="eyebrow">Your learning path</span><span class="eyebrow">⌕ &nbsp; 23 Sep</span></header><h1>One path.<br>Many returns.</h1><p class="dek">Reading and review are not separate places. They are points on the same thread.</p><div class="thread"><article class="event now"><div class="date">NOW · CONTINUE THREAD</div><h2>Meditations · checkpoint 12</h2><p>Your next reading window is 12 minutes. The page begins at the first visible line.</p><button class="primary" data-state="Continue thread selected">Return to the page →</button></article><article class="event"><div class="date">22 SEP · REVIEW RETURN</div><h2>What did justice require?</h2><p>One cue returned from Republic · segment 3. Mastery: familiar.</p></article><div class="branch"><div class="eyebrow">BRANCH / REPLACE WITHOUT ERASING</div><b>Confessions</b><br><span class="muted">A new line can grow from the same intention.</span></div><article class="event"><div class="date">20 SEP · FIRST SESSION</div><h2>Meditations began</h2><p>8 minutes read. One checkpoint saved. No account, no cloud, no noise.</p></article><article class="event"><div class="date">17 SEP · REVIEW RETURN</div><h2>Return to the Republic</h2><p>A spaced repetition brought you back to Book I.</p></article><div class="end"><div><div class="eyebrow">CURRENT MASTERY</div><strong>28 returns</strong></div><button data-state="Jump control is a prototype affordance">Jump to library ↗</button></div></div></div>`
};
const keys=Object.keys(titles), stage=document.querySelector('#stage'), name=document.querySelector('#name'), readout=document.querySelector('#readout');
let current=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase(); if(!keys.includes(current))current='A';
function show(next, push=true){current=keys[(keys.indexOf(next)+keys.length)%keys.length];stage.innerHTML=views[current]();name.textContent=`${current} · ${titles[current]}`;readout.textContent=`Paper light · ${current==='D'||current==='E'?'structural study':'representative home'}`;document.title=`Eruditio — ${current} ${titles[current]}`;if(push)history.replaceState({},'',`?variant=${current}`)}
function move(step){show(keys[(keys.indexOf(current)+step+keys.length)%keys.length])}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});document.addEventListener('click',e=>{const b=e.target.closest('[data-state]');if(b)readout.textContent=`Action preview · ${b.dataset.state}`});show(current,false);
</script>
</body></html>
